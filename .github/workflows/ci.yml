name: Scanet CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false # one failing Spark version should not cancel the other
      matrix:
        include:
          - java: 11
            spark: 3.5.10
          - java: 17
            spark: 4.3.0
    name: Spark ${{ matrix.spark }}, JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    env:
      SPARK_VERSION: ${{ matrix.spark }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: 'sbt'
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Run tests
      run: sbt -v "testOnly -- -l org.scalatest.tags.Slow"
